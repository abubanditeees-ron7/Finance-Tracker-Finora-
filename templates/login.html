<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Finora</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            color: #182230;
            padding: 20px;
        }

        .form-card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: white;
            border: 1px solid #e7ebf0;
            border-radius: 18px;
            box-shadow: 0 12px 35px #1822300c;
        }

        .logo {
            color: #2563eb;
            font-size: 25px;
            font-weight: bold;
        }

        h1 { margin-bottom: 8px; }

        .muted { color: #667085; }

        label {
            display: block;
            margin: 18px 0 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce2eb;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled { opacity: .6; }

        #message {
            margin-top: 16px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        a { color: #2563eb; }
    </style>
</head>
<body>
    <main class="form-card">
        <div class="logo">Finora</div>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to manage your money.</p>

        <form id="login-form">
            <label for="username">Username or email</label>
            <input id="username" name="username" required autocomplete="username">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   required autocomplete="current-password">

            <button id="submit-button" type="submit">Sign in</button>
        </form>

        <p id="message" role="status"></p>

        <p>Don't have an account?
            <a href="/register/">Create one</a>
        </p>
        <a href="/">Back to dashboard</a>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const message = document.getElementById("message");
        const button = document.getElementById("submit-button");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.textContent = "";
            button.disabled = true;

            try {
                const response = await fetch("/api/auth/login/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: form.username.value.trim(),
                        password: form.password.value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        Object.values(data).flat().join("\n") ||
                        "Unable to sign in."
                    );
                }

                if (!data.access || !data.refresh) {
                    throw new Error("The server did not return JWT tokens.");
                }

                localStorage.setItem("access_token", data.access);
                localStorage.setItem("refresh_token", data.refresh);

                window.location.href = "/dashboard/";
            } catch (error) {
                message.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
