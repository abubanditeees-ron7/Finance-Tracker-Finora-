{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Finora</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            color: #182230;
            padding: 20px;
        }

        .form-card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: white;
            border: 1px solid #e7ebf0;
            border-radius: 18px;
            box-shadow: 0 12px 35px #1822300c;
        }

        .logo {
            color: #2563eb;
            font-size: 25px;
            font-weight: bold;
        }

        .language-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .language-row label {
            margin: 0;
        }

        .language-row select {
            padding: 8px;
            border: 1px solid #dce2eb;
            border-radius: 8px;
            background: white;
        }

        h1 {
            margin-bottom: 8px;
        }

        .muted {
            color: #667085;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce2eb;
            border-radius: 9px;
            font-size: 15px;
        }

        .password-field {
            position: relative;
            width: 100%;
        }

        .password-field input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 6px;
            border: none;
            background: transparent;
            color: #475467;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
        }

        .toggle-password:hover {
            background: #f2f4f7;
            border-radius: 6px;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>

<body data-auth-page="login">
    <main class="form-card">
        <div class="logo">Finora</div>

        <div class="language-row">
            <label for="auth-language-select" data-auth-i18n="language">
                Language
            </label>

            <select id="auth-language-select" aria-label="Language">
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="uz">O‘zbekcha</option>
            </select>
        </div>

        <h1 data-auth-i18n="welcomeBack">Welcome back</h1>

        <p class="muted" data-auth-i18n="loginDescription">
            Sign in to manage your money.
        </p>

        <form id="login-form">
            <label for="username" data-auth-i18n="usernameOrEmail">
                Username or email
            </label>

            <input
                id="username"
                name="username"
                required
                autocomplete="username"
            >

            <label for="password" data-auth-i18n="password">
                Password
            </label>

            <div class="password-field">
                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-password-toggle="password"
                    aria-label="Show password"
                    title="Show password"
                >👁️</button>
            </div>

            <button
                id="submit-button"
                type="submit"
                data-auth-i18n="signIn"
            >
                Sign in
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <p>
            <span data-auth-i18n="noAccount">Don't have an account?</span>
            <a href="/register/" data-auth-i18n="createOne">Create one</a>
        </p>

        <a href="/" data-auth-i18n="backHome">Back to home</a>
    </main>

    <script src="{% static 'js/login.js' %}"></script>

    
</body>
</html>
