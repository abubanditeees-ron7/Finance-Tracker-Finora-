{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Finora</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            color: #182230;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 30px;
            background: white;
            border: 1px solid #e7ebf0;
            border-radius: 18px;
            box-shadow: 0 12px 35px #1822300c;
        }

        .logo {
            color: #2563eb;
            font-size: 25px;
            font-weight: bold;
        }

        .language-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .language-row label {
            margin: 0;
        }

        .language-row select {
            padding: 8px;
            border: 1px solid #dce2eb;
            border-radius: 8px;
            background: white;
        }

        h1 {
            margin-bottom: 8px;
        }

        .muted {
            color: #667085;
        }

        label {
            display: block;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce2eb;
            border-radius: 9px;
            font-size: 15px;
        }

        .password-field {
            position: relative;
            width: 100%;
        }

        .password-field input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 6px;
            border: none;
            background: transparent;
            color: #475467;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
        }

        .toggle-password:hover {
            background: #f2f4f7;
            border-radius: 6px;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        #message {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            margin-top: 16px;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>

<body data-auth-page="register">
    <main class="card">
        <div class="logo">Finora</div>

        <div class="language-row">
            <label for="auth-language-select" data-auth-i18n="language">
                Language
            </label>

            <select id="auth-language-select" aria-label="Language">
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="uz">O‘zbekcha</option>
            </select>
        </div>

        <h1 data-auth-i18n="createAccount">Create account</h1>

        <p class="muted" data-auth-i18n="registerDescription">
            Start managing your finances.
        </p>

        <form id="register-form">
            <label for="username" data-auth-i18n="username">
                Username
            </label>

            <input
                id="username"
                name="username"
                required
                maxlength="150"
                autocomplete="username"
            >

            <label for="email" data-auth-i18n="email">Email</label>

            <input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
            >

            <label for="password" data-auth-i18n="password">
                Password
            </label>

            <div class="password-field">
                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-password-toggle="password"
                    aria-label="Show password"
                    title="Show password"
                >👁️</button>
            </div>

            <label for="password_confirm" data-auth-i18n="confirmPassword">
                Confirm password
            </label>

            <div class="password-field">
                <input
                    id="password_confirm"
                    name="password_confirm"
                    type="password"
                    required
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-password-toggle="password_confirm"
                    aria-label="Show password"
                    title="Show password"
                >👁️</button>
            </div>

            <button
                id="register-button"
                type="submit"
                data-auth-i18n="createAccount"
            >
                Create account
            </button>
        </form>

        <form id="verify-form" class="hidden">
            <h2 data-auth-i18n="verifyEmail">Verify your email</h2>

            <p class="muted" data-auth-i18n="verificationDescription">
                Enter the six-digit code sent to your email.
            </p>

            <label for="verify-email" data-auth-i18n="email">Email</label>

            <input
                id="verify-email"
                type="email"
                required
                autocomplete="email"
            >

            <label for="code" data-auth-i18n="verificationCode">
                Verification code
            </label>

            <input
                id="code"
                inputmode="numeric"
                pattern="[0-9]{6}"
                minlength="6"
                maxlength="6"
                required
                autocomplete="one-time-code"
            >

            <button
                id="verify-button"
                type="submit"
                data-auth-i18n="verify"
            >
                Verify email
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <p>
            <span data-auth-i18n="alreadyRegistered">
                Already registered?
            </span>
            <a href="/login/" data-auth-i18n="signIn">Sign in</a>
        </p>

        <a href="/" data-auth-i18n="backHome">Back to home</a>
    </main>

    <script src="{% static 'js/register.js' %}"></script>

    
</body>
</html>
