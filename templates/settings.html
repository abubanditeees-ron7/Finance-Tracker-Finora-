
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Finora</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #182230;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            padding: 20px 6%;
            background: white;
            border-bottom: 1px solid #e7ebf0;
        }
        .logo {
            color: #2563eb;
            font-size: 25px;
            font-weight: 800;
            text-decoration: none;
        }
        nav { display: flex; gap: 10px; flex-wrap: wrap; }
        a { text-decoration: none; }
        button, select {
            padding: 11px 14px;
            border-radius: 9px;
            font: inherit;
        }
        button { border: 0; cursor: pointer; }
        .primary { background: #2563eb; color: white; }
        .secondary { background: #eef2f7; color: #344054; }
        main { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .panel {
            background: white;
            border: 1px solid #e7ebf0;
            border-radius: 16px;
            padding: 28px;
            margin-top: 24px;
        }
        .muted { color: #667085; line-height: 1.6; }
        label {
            display: block;
            font-weight: 700;
            margin: 20px 0 8px;
        }
        select { width: 100%; border: 1px solid #d0d5dd; background: white; }
        .message { margin-top: 15px; white-space: pre-wrap; }
        .error { color: #b42318; }
        .success { color: #15803d; }
    </style>
</head>
<body>
<header>
    <a class="logo" href="/">Finora.</a>
    <nav>
        <a class="secondary" href="/dashboard/">Dashboard</a>
        <button class="secondary" id="logout-button">Sign out</button>
    </nav>
</header>

<main>
    <h1 id="page-title">Settings</h1>
    <p class="muted" id="page-description">
        Manage your account preferences.
    </p>

    <section class="panel">
        <h2 id="profile-heading">Your profile</h2>
        <p class="muted">
            <strong id="username-label">Username:</strong>
            <span id="username">Loading...</span>
        </p>
        <p class="muted">
            <strong id="email-label">Email:</strong>
            <span id="email">Loading...</span>
        </p>

        <label for="language" id="language-label">Interface language</label>
        <select id="language">
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="uz">O‘zbekcha</option>
        </select>

        <p class="muted" id="language-help">
            Choose the language you prefer to use on Finora.
        </p>

        <button class="primary" id="save-language">
            Save settings
        </button>
        <div id="message" class="message" role="status"></div>
    </section>
</main>

<script src="/static/js/settings.js"></script>
</body>
</html>
